name: vectorize-existing
# Одноразовая векторизация PDF, которые УЖЕ лежат на Google Drive (не качает заново
# с arXiv/OpenAlex). Запускать вручную, когда хочется загнать существующий корпус
# в Qdrant без полного цикла harvest. После этого обычный harvest cron подхватит
# дельту в обычном режиме.
on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Лимит количества файлов (0 = без лимита). Полезно при первом тесте."
        default: "0"
        required: false
      include_docx:
        description: "Тянуть docx/ из Drive"
        default: "true"
        required: false
      include_txt:
        description: "Тянуть txt/ из Drive"
        default: "true"
        required: false

jobs:
  vectorize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: vectorize-existing
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone --version

      - name: Write rclone.conf from secret
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_DATA" ]; then
            echo "RCLONE_CONFIG не задан — Google Drive недоступен. Стоп."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Pull state.json from Drive (если есть)
        env:
          RCLONE_CONFIG: /home/runner/.config/rclone/rclone.conf
          GDRIVE_REMOTE: ${{ vars.GDRIVE_REMOTE || 'gdrive' }}
          GDRIVE_BASE: ${{ vars.GDRIVE_BASE || 'big-data' }}
        run: |
          mkdir -p harvester
          python -m harvester.gdrive_rclone pull-state || echo "(state.json не найден — нормально для первого прогона)"

      - name: Free up runner disk
        run: |
          # На ubuntu-latest пред-кэшировано ~10-15 GB всякого .NET/Android/Haskell.
          # Сносим, освобождаем место под PDF.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Pull PDFs/DOCX/TXT from Drive
        env:
          GDRIVE_REMOTE: ${{ vars.GDRIVE_REMOTE || 'gdrive' }}
          GDRIVE_BASE: ${{ vars.GDRIVE_BASE || 'big-data' }}
        run: |
          mkdir -p all_pdfs
          BASE="${GDRIVE_REMOTE}:${GDRIVE_BASE}"
          MAX='${{ github.event.inputs.max_files }}'
          INCLUDE_DOCX='${{ github.event.inputs.include_docx }}'
          INCLUDE_TXT='${{ github.event.inputs.include_txt }}'

          COMMON_FLAGS="--transfers 16 --checkers 32 --progress --stats=10s"

          echo "=== Pull PDF: ${BASE}/pdf ==="
          rclone copy "${BASE}/pdf" all_pdfs/ --include '*.pdf' $COMMON_FLAGS || echo "PDF copy failed (продолжаю)"

          if [ "$INCLUDE_DOCX" = "true" ]; then
            echo "=== Pull DOCX: ${BASE}/docx ==="
            rclone copy "${BASE}/docx" all_pdfs/ --include '*.docx' $COMMON_FLAGS || echo "DOCX copy failed (продолжаю)"
          fi
          if [ "$INCLUDE_TXT" = "true" ]; then
            echo "=== Pull TXT: ${BASE}/txt ==="
            rclone copy "${BASE}/txt" all_pdfs/ --include '*.txt' $COMMON_FLAGS || echo "TXT copy failed (продолжаю)"
          fi

          # Опционально обрезать до max_files (для быстрого теста)
          if [ "$MAX" != "0" ] && [ -n "$MAX" ]; then
            echo "=== Trimming to $MAX files ==="
            cd all_pdfs
            count=0
            for f in *; do
              count=$((count + 1))
              if [ $count -gt $MAX ]; then rm -f "$f"; fi
            done
            cd ..
          fi

          echo "=== Result ==="
          ls all_pdfs/ | wc -l
          du -sh all_pdfs/
          df -h /

      - name: Ingest PDFs → chunks_v2.jsonl
        env:
          HARVESTER_EMAIL: ${{ secrets.HARVESTER_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u ingest_v2.py
          echo "=== chunks_v2.jsonl stats ==="
          wc -l chunks_v2.jsonl || echo "chunks_v2.jsonl missing"
          du -h chunks_v2.jsonl || true

      - name: Embed chunks → Qdrant Cloud
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u embed_resume_v2.py

      - name: Push state.json back to Drive
        env:
          RCLONE_CONFIG: /home/runner/.config/rclone/rclone.conf
          GDRIVE_REMOTE: ${{ vars.GDRIVE_REMOTE || 'gdrive' }}
          GDRIVE_BASE: ${{ vars.GDRIVE_BASE || 'big-data' }}
        run: |
          python -m harvester.gdrive_rclone push --state-only || echo "Push state failed (не критично)"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vectorize-existing-${{ github.run_id }}
          path: |
            harvester/state.json
            harvester/logs/
          if-no-files-found: ignore
          retention-days: 14
