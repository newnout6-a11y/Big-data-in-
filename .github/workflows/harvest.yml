name: harvest

# Харвестер по запросу: workflow_dispatch забирает свежие документы из arXiv,
# OpenAlex, Europe PMC, Stack Exchange, Semantic Scholar (и опционально chemRxiv,
# КиберЛенинка, CORE), ингестит их и пушит чанки в удалённый Qdrant.
#
# Прогресс (state.json) и сами документы НЕ коммитятся обратно в репо —
# они уезжают в Google Drive через rclone. Никаких git push'ей с данными.
#
# Требуемые секреты (Settings → Secrets and variables → Actions):
#   QDRANT_URL        — URL Qdrant Cloud (обязательно)
#   QDRANT_API_KEY    — ключ Qdrant Cloud (обязательно)
#   HARVESTER_EMAIL   — email для User-Agent OpenAlex и для Unpaywall fallback
#   GROQ_API_KEY      — для Streamlit-приложения (не используется в cron'е)
#
# Google Drive (рекомендуемый бэкап без git push):
#   RCLONE_CONFIG     — содержимое rclone.conf c remote'ом `gdrive`
#                       (см. документация/GOOGLE_DRIVE.md)
#   GDRIVE_BASE       — корневая папка в Drive (default: big-data)
#
# Опциональные:
#   CORE_API_KEY      — ключ https://core.ac.uk/services/api для источника CORE
#   S3_ENDPOINT_URL   — URL S3-совместимого хранилища
#   S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY, S3_REGION, S3_PREFIX
# Если S3_BUCKET задан — после ingest+embed файлы синхронизируются в S3.
# Если RCLONE_CONFIG задан — то же самое в Drive (рекомендуемый путь).

on:
  # Бесконечный режим: cron триггерит run каждые 10 минут (минимальный
  # интервал, который GH Actions гарантированно держит). Между прогонами
  # state.json синкается через Drive, так что новый runner продолжает с того
  # места, где остановился предыдущий.
  #
  # При concurrency: cancel-in-progress: false параллельные cron-триггеры не
  # запускаются — если предыдущий run ещё идёт, следующий просто пропустится.
  # Это нормально: cron'ы без перерывов = непрерывный поток новых файлов в Drive.
  #
  # Никаких git push'ей с данными — только rclone в Drive.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Сколько документов за прогон (всего)"
        default: "500"
      sources:
        description: "Источники через запятую"
        default: "arxiv,openalex,europepmc,stackexchange,semanticscholar,chemrxiv,core"
      year_min:
        description: "Минимальный год публикации"
        default: "2020"
      run_ingest:
        description: "Запускать ingest_v2 (true/false). По умолчанию false — только скачивание + push в Drive."
        default: "false"
      run_embed:
        description: "Запускать embed_resume_v2 (true/false). По умолчанию false — векторизация делается локально."
        default: "false"

permissions:
  contents: read

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Прокидываем секрет через job-env, чтобы можно было проверять его
      # пустоту в step.if (ссылаться на ${{ secrets.* }} прямо в `if:`
      # GitHub Actions не разрешает).
      RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install rclone
        if: ${{ env.RCLONE_CONFIG_CONTENT != '' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone.conf from secret
        if: ${{ env.RCLONE_CONFIG_CONTENT != '' }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          # sanity-check: видим ли remote
          rclone listremotes --config "$HOME/.config/rclone/rclone.conf"

      - name: Run harvester.loop (бесконечный цикл внутри runner'а до timeout)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          HARVESTER_EMAIL: ${{ secrets.HARVESTER_EMAIL }}
          # Если секрет не задан — переменная пустая, соответствующий шаг
          # внутри harvest_full просто пропустится.
          CORE_API_KEY: ${{ secrets.CORE_API_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_PREFIX: ${{ secrets.S3_PREFIX }}
          # Google Drive через rclone:
          GDRIVE_REMOTE: ${{ vars.GDRIVE_REMOTE || 'gdrive' }}
          GDRIVE_BASE: ${{ vars.GDRIVE_BASE || 'big-data' }}
        run: |
          # Запускаем harvester.loop — он сам бесконечно итерирует:
          #   harvest_full → push в Drive → sleep → harvest_full → ...
          # Пока не упрётся в timeout-minutes (350 = ~5.5 часа). Каждая итерация
          # ~8-12 минут с budget=200, между ними sleep 2-5 минут с jitter.
          # Это гарантирует непрерывный поток в Drive независимо от того,
          # как часто GH Actions фактически триггерит cron (а cron-триггеры
          # известны как ненадёжные у GitHub Actions: задержки до 30+ минут,
          # пропуски при высокой нагрузке).
          #
          # ingest/embed выключены по умолчанию — векторизация делается локально.
          ARGS=()
          if [ "${{ github.event.inputs.run_ingest || 'false' }}" != "true" ]; then
            ARGS+=(--skip-ingest)
          fi
          if [ "${{ github.event.inputs.run_embed || 'false' }}" != "true" ]; then
            ARGS+=(--skip-embed)
          fi
          python -m harvester.loop \
            --budget "${{ github.event.inputs.budget || '200' }}" \
            --year-min "${{ github.event.inputs.year_min || '2020' }}" \
            --sources "${{ github.event.inputs.sources || 'arxiv,openalex,europepmc,stackexchange,semanticscholar,chemrxiv,core' }}" \
            --email "${{ secrets.HARVESTER_EMAIL }}" \
            --work-min-low 8 --work-min-high 12 \
            --sleep-min-low 2 --sleep-min-high 5 \
            --max-iterations 0 \
            "${ARGS[@]}"

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ github.run_id }}
          path: |
            harvester/logs/
            harvester/state.json
          retention-days: 30
          if-no-files-found: ignore
